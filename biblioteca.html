<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormaTI | Biblioteca</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="topbar"><a class="brand" href="dashboard.html">Forma<span>TI</span></a>
        <nav><a href="dashboard.html">Dashboard</a><a class="active" href="trilhas.html">Trilhas</a><a
                href="certificado.html">Certificados</a></nav><button class="user-chip" onclick="logout()">Sair</button>
    </header>
    <main class="container">
        <a class="back" href="trilhas.html">← Voltar para trilhas</a>
        <div class="page-title">
            <p class="eyebrow">BIBLIOTECA DA TRILHA</p>
            <h1 id="libTitle">Biblioteca</h1>
            <p class="muted">Estude os materiais e marque cada conteúdo como concluído.</p>
        </div>
        <div class="library-progress">
            <div><strong>Seu progresso</strong><span id="libraryPercent">0%</span></div>
            <div class="progress"><i id="libraryBar"></i></div>
        </div>
        <section id="publicTrainingList" class="modules"></section>
        <div class="quiz-cta" id="quizCta">
            <div><strong>Terminou os estudos?</strong>
                <p>Conclua todos os conteúdos para liberar o quiz.</p>
            </div><a class="btn primary" href="quiz.html">Iniciar quiz</a>
        </div>
    </main>
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
</body>

</html>

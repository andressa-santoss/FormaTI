<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormaTI | Estudo</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .youtube-player {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      border-radius: 17px;
      overflow: hidden;
      margin-top: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08)
    }

    .youtube-player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0
    }

    .pdf-viewer {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      min-height: 80vh;
      background: #f3f4f6;
      border-radius: 17px;
      overflow: hidden;
      margin-top: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08)
    }

    .pdf-viewer iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0
    }

    .video-error {
      margin-top: 24px;
      padding: 18px;
      border-radius: 14px;
      background: #fff1f1;
      color: #9b2c2c;
      border: 1px solid #f0caca
    }
  </style>
</head>

  <header class="topbar"><a class="brand" href="dashboard.html">Forma<span>TI</span></a>

        href="certificado.html">Certificados</a></nav><button class="user-chip" onclick="logout()">Sair</button>
  </header>

    <div id="publicStudyContent"></div>
  </main>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>

</html>

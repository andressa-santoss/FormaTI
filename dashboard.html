<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormaTI | Inicio</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="topbar"><a class="brand" href="dashboard.html">Forma<span>TI</span></a>
    <nav><a class="active" href="dashboard.html">Inicio</a><a href="trilhas.html">Trilhas</a><a
        href="certificado.html">Certificados</a></nav>
    <button class="user-chip" onclick="logout()">Sair</button>
  </header>
  <main class="container">
    <section class="hero">
      <div>
        <p class="eyebrow">SEU ESPAÇO DE APRENDIZAGEM</p>
        <h1>Olá, <span id="userName">Aluno</span>!</h1>
        <p class="muted">Continue sua jornada e desenvolva novas habilidades em tecnologia.</p>
      </div>
      <a class="btn primary" href="trilhas.html">Iniciar trilhas</a>
    </section>
    <section class="stats">
      <article><strong id="statProgress">0%</strong><span>Progresso médio</span></article>
      <article><strong id="statAvailable">0</strong><span>Trilhas disponíveis</span></article>
      <article><strong id="statCompleted">0</strong><span>Trilhas concluídas</span></article>
      <article><strong id="statCertificates">0</strong><span>Certificados</span></article>
    </section>
    <section class="section-head">
      <div>
        <p class="eyebrow">CONTINUE DE ONDE PAROU</p>
        <h2>Minhas trilhas</h2>
      </div>
    </section>
    <div id="dashTracks"></div>
  </main>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>

</html>

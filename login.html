<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormaTI | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
  <main class="auth-card">
    <div class="brand">Forma<span>TI</span></div>
    <p class="eyebrow">PLATAFORMA DE FORMAÇÃO</p>
    <h1>Aprenda tecnologia no seu ritmo.</h1>
    <p class="muted">Acesse suas trilhas, materiais, avaliações e certificados.</p>
    <form id="loginForm" class="form">
      <label>E-mail<input id="email" type="email" placeholder="seu@email.com" required></label>
      <label>Senha<input id="password" type="password" placeholder="••••••••" required></label>
      <button class="btn primary" type="submit">Entrar na plataforma</button>
    </form>
    <p class="demo">Demo: qualquer e-mail e senha funcionam.</p><a class="admin-access-link"
      href="admin-login.html">Acesso administrativo →</a>
  </main>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
